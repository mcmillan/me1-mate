<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ME-1 Mate: offline editor for Allen &amp; Heath ME-1 and ME-U</title>
    <meta
      name="description"
      content="A free offline editor for Allen &amp; Heath ME-1 personal mixers: set up the keys of an ME-1 config (.ME1) and name the channels of an ME-U (.meu) in your browser. Files never leave your computer."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome follows the page: `--canvas` in src/styles.css. -->
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277%27%20fill=%27%23ee5a1e%27/%3E%3Ctext%20x=%2716%27%20y=%2721.5%27%20text-anchor=%27middle%27%20font-family=%27system-ui%2Csans-serif%27%20font-weight=%27800%27%20font-size=%2714%27%20fill=%27%23fff%27%3EME1%3C/text%3E%3C/svg%3E" />
    <!-- The one typeface, Allo (SIL Open Font License; see fonts/Allo-OFL.txt). -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/AlloVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Critical CSS: the typeface, and the page's background and text colour
      before the script runs, so there's no flash of the wrong colour. Keep in
      step with `--canvas` and `--ink` in src/styles.css.
    -->
    <style>
      @font-face {
        font-family: Allo;
        src: url("%BASE_URL%fonts/AlloVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        color-scheme: light dark;
        --page-bg: #fbfaf8;
        --page-fg: #131316;
        background-color: var(--page-bg);
        color: var(--page-fg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #101012;
          --page-fg: #f6f5f2;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
