<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2me2u</title>
    <meta
      name="description"
      content="Edit Allen &amp; Heath ME-1 configs and ME-U channel setups in your browser. Files never leave your computer."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome follows the page: `--canvas` in src/styles.css. -->
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20x=%272%27%20y=%275%27%20width=%2717%27%20height=%2719%27%20rx=%274.5%27%20fill=%27%23ffb000%27%20transform=%27rotate(-7%2010%2014)%27/%3E%3Crect%20x=%2713%27%20y=%279%27%20width=%2717%27%20height=%2719%27%20rx=%274.5%27%20fill=%27%2300c2a8%27%20transform=%27rotate(5%2021%2018)%27/%3E%3C/svg%3E" />
    <!-- The one typeface, Allo (SIL Open Font License; see fonts/Allo-OFL.txt). -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/AlloVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Critical CSS: the typeface, and the page's background and text colour
      before the script runs, so there's no flash of the wrong colour. Keep in
      step with `--canvas` and `--ink` in src/styles.css.
    -->
    <style>
      @font-face {
        font-family: Allo;
        src: url("%BASE_URL%fonts/AlloVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        color-scheme: light dark;
        --page-bg: #fbfaf8;
        --page-fg: #131316;
        background-color: var(--page-bg);
        color: var(--page-fg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #101012;
          --page-fg: #f6f5f2;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
