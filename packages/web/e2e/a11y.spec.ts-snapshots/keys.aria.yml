- radiogroup "Keys":
    - 'radio "Key 1: Kit, Group, 7 channels, -0.4 dB"': /\d+ Kit 7 ch/
    - 'radio "Key 2: Perc, Group, 8 channels, 0 dB" [checked]': /\d+ Perc 8 ch/
    - 'radio /Key 3: Bass, Channel, channel \d+, -0\.4 dB/': /\d+ Bass Ch \d+/
    - 'radio "Key 4: Guit 1, Group, 2 channels, 0 dB"': /\d+ Guit 1 2 ch/
    - 'radio /Key 5: Guit 2, Channel, channel \d+, -0\.4 dB/': /\d+ Guit 2 Ch \d+/
    - 'radio "Key 6: Wind, Group, 2 channels, -1.1 dB"': /\d+ Wind 2 ch/
    - 'radio /Key 7: Horn, Channel, channel \d+, -0\.8 dB/': /\d+ Horn Ch \d+/
    - 'radio "Key 8: Strngs, Group, 4 channels, 0 dB"': /\d+ Strngs 4 ch/
    - 'radio /Key 9: Keys 1, Channel, channels \d+ and \d+, -0\.4 dB/': /\d+ Keys 1 Ch \d+\+\d+/
    - 'radio /Key \d+: Keys 2, Channel, channels \d+ and \d+, \+0\.4 dB/': /\d+ Keys 2 Ch \d+\+\d+/
    - 'radio /Key \d+: Piano, Channel, channels \d+ and \d+, -0\.4 dB/': /\d+ Piano Ch \d+\+\d+/
    - 'radio /Key \d+: MD T\/B, Channel, channel \d+, 0 dB/': /\d+ MD T\/B Ch \d+/
    - 'radio /Key \d+: Track, Channel, channels \d+ and \d+, \+0\.8 dB/': /\d+ Track Ch \d+\+\d+/
    - 'radio /Key \d+: Click, Channel, channel \d+, 0 dB/': /\d+ Click Ch \d+/
    - 'radio /Key \d+: Vox, Group, 2 channels, \+0\.4 dB/': /\d+ Vox 2 ch/
    - 'radio /Key \d+: Auto, Auto, next free channel, 0 dB/': /\d+ Auto next free/
