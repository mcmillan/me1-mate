- region "Key 2":
    - 'heading "Key 2: Group" [level=2]'
    - button "Previous key"
    - button "Next key"
    - paragraph: The ME-1 shows Perc
    - paragraph: 8 channels · 0 dB
    - group "Key 2 type":
        - button "Empty"
        - button "Channel"
        - button "Group" [pressed]
        - button "Auto"
    - text: Label Up to 6 letters, numbers or spaces
    - textbox "Label":
        - /placeholder: Group
        - text: Perc
    - text: Master level
    - slider "Key 2 master level": /\d+/
    - textbox "Key 2 master level in dB": "0.0"
    - group "Key 2 channels":
        - heading "Channels · 8" [level=3]
        - text: Level in the group, dB
        - list:
            - listitem:
                - text: XylGlk 9
                - slider "XylGlk 9 level in key 2": /\d+/
                - textbox "XylGlk 9 level in key 2 in dB": "+4.2"
                - button "Remove XylGlk 9 from key 2"
            - listitem:
                - text: /Vibes \d+/
                - slider /Vibes \d+ level in key 2/: /\d+/
                - textbox /Vibes \d+ level in key 2 in dB/: "+3.5"
                - button /Remove Vibes \d+ from key 2/
            - listitem:
                - text: /Crtles \d+/
                - slider /Crtles \d+ level in key 2/: /\d+/
                - textbox /Crtles \d+ level in key 2 in dB/: "+4.2"
                - button /Remove Crtles \d+ from key 2/
            - listitem:
                - text: /SusCym \d+/
                - slider /SusCym \d+ level in key 2/: /\d+/
                - textbox /SusCym \d+ level in key 2 in dB/: "+3.5"
                - button /Remove SusCym \d+ from key 2/
            - listitem:
                - text: /Congas \d+/
                - slider /Congas \d+ level in key 2/: /\d+/
                - textbox /Congas \d+ level in key 2 in dB/: "+3.9"
                - button /Remove Congas \d+ from key 2/
            - listitem:
                - text: /OrchBD \d+/
                - slider /OrchBD \d+ level in key 2/: /\d+/
                - textbox /OrchBD \d+ level in key 2 in dB/: "+3.5"
                - button /Remove OrchBD \d+ from key 2/
            - listitem:
                - text: /PrcPad \d+\+\d+ stereo/
                - slider /PrcPad \d+\+\d+ stereo level in key 2/: /\d+/
                - textbox /PrcPad \d+\+\d+ stereo level in key 2 in dB/: "+3.5"
                - button /Remove PrcPad \d+\+\d+ stereo from key 2/
            - listitem:
                - text: /Toys \d+/
                - slider /Toys \d+ level in key 2/: /\d+/
                - textbox /Toys \d+ level in key 2 in dB/: "+4.2"
                - button /Remove Toys \d+ from key 2/
